[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/client"]
default-members = ["crates/protocol", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
