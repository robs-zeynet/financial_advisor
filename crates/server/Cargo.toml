[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "financial-advisor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
bytes = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
regex = "1"
whisper-rs = { version = "0.15", features = ["tracing_backend"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
tempfile = "3"
